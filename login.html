<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seleccionar Usuario - NEXUS.OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="icon" type="svg+xml" href="favicon.svg">
</head>
<body class="bg-slate-950 text-white h-screen overflow-hidden flex flex-col justify-between p-12 select-none">
    <div class="waves-bg fixed inset-0 z-0 pointer-events-none opacity-80"></div>

    <div class="relative z-10 flex items-center gap-4">
        <div class="text-4xl font-extrabold tracking-widest text-blue-100 flex items-center gap-2">
            <span>⚡</span> NEXUS.OS
        </div>
    </div>

    <div class="relative z-10 flex flex-col items-center justify-center gap-6">
        <p class="text-slate-300 text-sm tracking-wide">🎮 Mando inalámbrico DUALSHOCK 4 conectado.</p>
        <h2 class="text-2xl font-bold text-white mb-4">¿Quién usa este mando?</h2>

        <div id="users-container" class="flex gap-8 items-center">
            <!-- Dinámico -->
        </div>
    </div>

    <div class="relative z-10 flex justify-between items-center text-xs text-slate-400 border-t border-white/10 pt-4">
        <span><kbd class="bg-white/20 px-2 py-0.5 rounded text-white">Enter</kbd> Confirmar</span>
        <button onclick="window.location.href='setup.html'" class="text-xs text-blue-300 hover:text-white transition font-bold cursor-pointer">+ Crear nuevo usuario</button>
    </div>

    <script>
        const users = JSON.parse(localStorage.getItem('nexus_os_users') || '[]');
        const container = document.getElementById('users-container');

        users.forEach((u, idx) => {
            const card = document.createElement('button');
            card.className = `user-card flex flex-col items-center gap-3 p-4 rounded-xl border-2 ${idx === 0 ? 'border-white bg-white/10 scale-105' : 'border-transparent bg-white/5'} hover:bg-white/10 transition-all cursor-pointer`;
            card.innerHTML = `
                <div class="w-24 h-24 rounded-lg bg-blue-600 flex items-center justify-center text-4xl border border-white/20">
                    ${u.avatar}
                </div>
                <span class="font-bold text-sm tracking-wide text-white">${u.username}</span>
            `;
            card.addEventListener('click', () => {
                localStorage.setItem('nexus_active_user', JSON.stringify(u));
                window.location.href = 'menu.html';
            });
            container.appendChild(card);
        });
    </script>
</body>
</html>
