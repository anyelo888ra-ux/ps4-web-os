<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07152e"><title>Seleccionar usuario — NEXUS.OS</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="assets/css/style.css"><link rel="stylesheet" href="assets/css/ps4tcha.css">
<style>
*{box-sizing:border-box}body{min-height:100vh;margin:0;background:#06132b;color:#fff;font-family:Arial,sans-serif;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(18px,4vw,48px);overflow-x:hidden}.waves-bg{position:fixed!important;inset:0;z-index:0;pointer-events:none}.layer{position:relative;z-index:1}.brand{font-weight:900;letter-spacing:.18em;font-size:26px}.panel{width:min(850px,100%);margin:auto;text-align:center}.cards{display:flex;justify-content:center;gap:18px;flex-wrap:wrap}.user-card{width:150px;min-height:165px;background:#ffffff0b;border:1px solid #ffffff25;color:white;border-radius:14px;padding:17px;display:flex;flex-direction:column;align-items:center;gap:13px;cursor:pointer;transition:.2s}.user-card:hover,.user-card:focus-visible{transform:translateY(-5px);border-color:#8bc5ff;background:#ffffff18;outline:none}.avatar{width:76px;height:76px;border-radius:13px;background:linear-gradient(145deg,#247ad4,#243a83);display:grid;place-items:center;font-size:37px}.muted{color:#a9bbd2}.action{background:#ffffff12;border:1px solid #ffffff25;color:#c9e3ff;padding:10px 15px;border-radius:8px;cursor:pointer}.action:hover{background:#ffffff25}.empty{padding:28px;border:1px dashed #ffffff35;border-radius:12px}.footer{border-top:1px solid #ffffff20;padding-top:15px;font-size:12px;color:#a9bbd2;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
</style></head><body><div class="waves-bg"></div><header class="layer brand">◈ NEXUS.OS</header><main class="layer panel"><p class="muted text-sm">PERFILES LOCALES</p><h1 style="font-size:clamp(25px,5vw,36px);margin:8px 0 28px">¿Quién está jugando?</h1><div id="users-container" class="cards"></div><p id="notice" class="muted" style="margin-top:22px;font-size:13px"></p></main><footer class="layer footer"><span>ENTER / CLIC · Seleccionar perfil</span><div><button class="action" id="newUser">＋ Crear usuario</button> <button class="action" id="guest">Invitado</button></div></footer>
<script src="assets/js/audio.js"></script><script src="assets/js/ps4tcha.js"></script><script>
(()=>{const box=document.querySelector('#users-container'),notice=document.querySelector('#notice');let users=[];try{users=JSON.parse(localStorage.getItem('nexus_os_users')||'[]');if(!Array.isArray(users))users=[]}catch{users=[]}
function enter(u){localStorage.setItem('nexus_active_user',JSON.stringify(u));audio.playSelect();location.href='menu.html'}
users.forEach((u,i)=>{if(!u||typeof u.username!=='string')return;const b=document.createElement('button');b.className='user-card';b.type='button';const avatar=document.createElement('span');avatar.className='avatar';avatar.textContent=String(u.avatar||'🎮');const name=document.createElement('strong');name.textContent=u.username;b.append(avatar,name);b.addEventListener('click',()=>enter(u));b.addEventListener('mouseenter',()=>audio.playMove());box.append(b)});
if(!box.children.length){notice.textContent='Todavía no hay perfiles. Crea uno para empezar.';const b=document.createElement('div');b.className='empty muted';b.textContent='NEXUS.OS está listo para tu primer jugador.';box.append(b)}
document.querySelector('#newUser').onclick=()=>location.href='setup.html';document.querySelector('#guest').onclick=()=>enter({id:'guest',username:'Invitado',avatar:'👤'});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&box.querySelector('button'))box.querySelector('button').click()});
})();
</script></body></html>
