<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07152e"><title>Control remoto — NEXUS.OS</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#061326;color:#fff;font:14px Arial;padding:22px}main{max-width:900px;margin:auto}.muted{color:#9db5d2}.panel{padding:18px;background:#ffffff0b;border:1px solid #ffffff22;border-radius:12px;margin:14px 0}button{padding:11px 15px;border:1px solid #ffffff25;border-radius:8px;background:#176bc3;color:white;cursor:pointer;font-weight:bold}textarea{width:100%;min-height:115px;background:#020a17;color:#bde0ff;border:1px solid #ffffff30;border-radius:8px;padding:10px;font:12px monospace}video{width:100%;max-height:48vh;background:#000;border-radius:10px}.pad{display:grid;grid-template-columns:repeat(3,minmax(65px,95px));gap:9px;justify-content:center;margin:16px}.pad button{min-height:58px;font-size:18px}.status{color:#9bd0ff;white-space:pre-wrap}</style></head><body><main><p class="muted">NEXUS.OS · WEBRTC CONTROLLER</p><h1>🎮 Control remoto</h1><p class="muted">ID: <code id="id"></code></p><button onclick="location.href='/apps/share.html'">← Centro de compartir</button><section class="panel"><h2>1. Pega la oferta del dispositivo emisor</h2><textarea id="offer" placeholder="Pega aquí el JSON de oferta"></textarea><button id="connect">Crear respuesta</button></section><section class="panel"><h2>2. Envía esta respuesta al emisor</h2><textarea id="answer" readonly placeholder="La respuesta aparecerá aquí"></textarea><button id="copy">Copiar respuesta</button><p class="muted">Cuando el emisor aplique tu respuesta, aparecerá la pantalla aquí.</p><video id="remote" autoplay playsinline></video></section><section class="panel"><h2>Controles de NEXUS.OS</h2><div class="pad"><span></span><button data-key="ArrowUp">▲</button><span></span><button data-key="ArrowLeft">◀</button><button data-key="Enter">OK</button><button data-key="ArrowRight">▶</button><span></span><button data-key="ArrowDown">▼</button><span></span></div><div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap"><button data-key="Escape">Volver</button><button data-key=" ">Pausa / Espacio</button></div><p class="status" id="status">Esperando oferta…</p></section></main><script>
(()=>{'use strict';const id=decodeURIComponent(location.pathname.split('/').filter(Boolean).pop()||'');document.querySelector('#id').textContent=id;const $=s=>document.querySelector(s);let pc=null,dc=null;const local=typeof BroadcastChannel!=='undefined'?new BroadcastChannel('nexus-os-control-'+id):null;function status(s){$('#status').textContent=s}function waitIce(peer){return new Promise(resolve=>{if(peer.iceGatheringState==='complete')return resolve();const timer=setTimeout(resolve,8000);peer.addEventListener('icegatheringstatechange',()=>{if(peer.iceGatheringState==='complete'){clearTimeout(timer);resolve()}},{once:false})})}function send(key){const msg=JSON.stringify({type:'key',key});if(dc&&dc.readyState==='open')dc.send(msg);if(local)local.postMessage({type:'key',key});}document.querySelectorAll('[data-key]').forEach(b=>{const key=b.dataset.key;b.addEventListener('click',()=>send(key));b.addEventListener('touchstart',e=>{e.preventDefault();send(key)},{passive:false})});$('#connect').onclick=async()=>{try{const offer=JSON.parse($('#offer').value);pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.ontrack=e=>{$('#remote').srcObject=e.streams[0]};pc.ondatachannel=e=>{dc=e.channel;dc.onopen=()=>status('Control conectado.');dc.onclose=()=>status('Canal de control cerrado.');};pc.onconnectionstatechange=()=>status('Estado WebRTC: '+pc.connectionState);await pc.setRemoteDescription(offer);const answer=await pc.createAnswer();await pc.setLocalDescription(answer);status('Preparando respuesta…');await waitIce(pc);$('#answer').value=JSON.stringify(pc.localDescription);status('Respuesta lista. Envíala al dispositivo emisor.')}catch(e){status('No se pudo conectar: '+e.message)}};$('#copy').onclick=async()=>{try{await navigator.clipboard.writeText($('#answer').value);status('Respuesta copiada.')}catch{status('Selecciona y copia el texto manualmente.')}};window.addEventListener('beforeunload',()=>{if(pc)pc.close();if(local)local.close()})})();
</script></body></html>
