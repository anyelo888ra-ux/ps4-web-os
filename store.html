<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07152e"><title>NEXUS Store — Juegos HTML</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="manifest" href="/manifest.webmanifest"><link rel="stylesheet" href="assets/css/nexus-ui.css"><link rel="stylesheet" href="assets/css/style.css"></head>
<body class="min-h-screen bg-slate-950 text-white p-5 md:p-10"><div class="waves-bg fixed inset-0 z-0 opacity-80 pointer-events-none"></div><main class="relative z-10 max-w-6xl mx-auto">
<header class="flex flex-wrap items-center justify-between gap-4 border-b border-white/10 pb-5 mb-7"><div class="flex items-center gap-4"><button id="back" class="bg-white/10 hover:bg-white/20 px-4 py-2 rounded-lg text-xs font-bold">← Menú</button><div><h1 class="text-2xl font-extrabold text-blue-100">🛍️ NEXUS Store</h1><p class="text-xs text-slate-400">Biblioteca local de juegos HTML</p></div></div><div class="flex flex-wrap gap-2"><button id="tabStore" class="px-4 py-2 rounded-lg text-xs font-bold bg-blue-600">Explorar</button><button id="tabPublish" class="px-4 py-2 rounded-lg text-xs font-bold bg-white/10">Crear juego</button><button id="importBtn" class="px-4 py-2 rounded-lg text-xs font-bold bg-white/10">Importar .nexusgame</button><input id="importFile" type="file" accept=".nexusgame,.json,application/json" hidden></div></header>
<section id="viewStore"><div class="flex flex-wrap justify-between gap-3 items-center mb-5"><div><h2 class="text-lg font-bold">Juegos de la comunidad</h2><p class="text-xs text-slate-400">Los juegos se guardan en este navegador. Exporta un archivo para compartirlos.</p></div><span id="total" class="text-xs text-slate-400"></span></div><div id="gamesGrid" class="grid sm:grid-cols-2 lg:grid-cols-3 gap-5"></div></section>
<section id="viewPublish" class="hidden max-w-3xl mx-auto"><h2 class="text-xl font-bold mb-2">Publicar un juego HTML</h2><p class="text-xs text-slate-400 mb-5">Crea un paquete local. No se sube a internet ni aparece automáticamente en otros dispositivos.</p><div class="bg-white/5 p-5 rounded-2xl border border-white/10 space-y-4"><label class="block text-xs font-bold text-slate-300">Título<input id="title" maxlength="60" class="mt-2 w-full bg-slate-900 border border-white/20 rounded-lg px-4 py-3 text-sm" placeholder="Mi juego"></label><label class="block text-xs font-bold text-slate-300">Código HTML<textarea id="html" rows="12" class="mt-2 w-full bg-slate-900 border border-white/20 rounded-lg p-4 text-xs font-mono" placeholder="<!doctype html>..."></textarea></label><button id="publish" class="w-full bg-emerald-600 hover:bg-emerald-500 font-bold py-3 rounded-lg">Guardar en mi Store</button><p id="publishStatus" class="text-xs text-blue-200" role="status"></p></div></section><p id="status" class="text-xs text-blue-200 mt-5" role="status"></p>
</main><script>
(()=>{'use strict';const $=s=>document.querySelector(s),KEY='nexus_published_games';let activeUser={};try{activeUser=JSON.parse(localStorage.getItem('nexus_active_user')||'null')}catch{}if(!activeUser){location.href='login.html';return}$('#back').onclick=()=>location.href='menu.html';function getGames(){try{const a=JSON.parse(localStorage.getItem(KEY)||'[]');return Array.isArray(a)?a:[]}catch{return []}}function setGames(a){localStorage.setItem(KEY,JSON.stringify(a))}function setTab(tab){const pub=tab==='publish';$('#viewStore').classList.toggle('hidden',pub);$('#viewPublish').classList.toggle('hidden',!pub);$('#tabStore').className='px-4 py-2 rounded-lg text-xs font-bold '+(!pub?'bg-blue-600':'bg-white/10');$('#tabPublish').className='px-4 py-2 rounded-lg text-xs font-bold '+(pub?'bg-blue-600':'bg-white/10');}function trophy(id){try{const key='nexus_os_trophies_v1',all=JSON.parse(localStorage.getItem(key)||'{}'),uid=String(activeUser.id||'guest');all[uid]=all[uid]||{};all[uid][id]=all[uid][id]||{at:new Date().toISOString()};localStorage.setItem(key,JSON.stringify(all))}catch{}}function download(g){const pack={format:'NEXUS_GAME',schema:1,id:g.id,title:g.title,author:g.author,htmlContent:g.htmlContent,createdAt:g.createdAt||new Date().toISOString()};const blob=new Blob([JSON.stringify(pack,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=(g.title||'nexus-game').replace(/[^a-z0-9_-]+/gi,'-')+'.nexusgame';a.click();setTimeout(()=>URL.revokeObjectURL(url),1200);trophy('share-game');$('#status').textContent='Paquete del juego descargado. Ya puedes compartir el archivo.'}function launch(g){try{sessionStorage.setItem('nexus_game_to_run',JSON.stringify(g));const w=window.open('apps/game-player.html','_blank');if(!w)$('#status').textContent='El navegador bloqueó la ventana. Permite ventanas emergentes para ejecutar el juego.'}catch(e){$('#status').textContent='No se pudo preparar el juego: '+e.message}}function render(){const grid=$('#gamesGrid'),games=getGames();grid.replaceChildren();$('#total').textContent=games.length+' juego(s)';if(!games.length){const p=document.createElement('p');p.className='text-sm text-slate-400 col-span-full bg-white/5 rounded-xl p-6';p.textContent='Todavía no hay juegos. Crea uno o importa un archivo .nexusgame.';grid.append(p);return}games.forEach((g,i)=>{if(!g||typeof g.htmlContent!=='string')return;const card=document.createElement('article');card.className='bg-slate-900/80 p-5 rounded-xl border border-white/10 flex flex-col gap-4';const h=document.createElement('h3');h.className='font-bold text-base';h.textContent=g.title||'Juego sin título';const by=document.createElement('p');by.className='text-xs text-slate-400';by.textContent='Creado por: '+(g.author||'Jugador');const actions=document.createElement('div');actions.className='flex gap-2 flex-wrap mt-auto';const play=document.createElement('button');play.className='bg-blue-600 px-3 py-2 rounded-lg text-xs font-bold';play.textContent='▶ Ejecutar';play.onclick=()=>launch(g);const exp=document.createElement('button');exp.className='bg-white/10 px-3 py-2 rounded-lg text-xs';exp.textContent='⇩ Exportar';exp.onclick=()=>download(g);const del=document.createElement('button');del.className='bg-red-900/60 px-3 py-2 rounded-lg text-xs';del.textContent='Eliminar';del.onclick=()=>{if(!confirm('¿Eliminar este juego de este navegador?'))return;const a=getGames();a.splice(i,1);setGames(a);render()};actions.append(play,exp,del);card.append(h,by,actions);grid.append(card)})}$('#tabStore').onclick=()=>setTab('store');$('#tabPublish').onclick=()=>setTab('publish');$('#publish').onclick=()=>{const title=$('#title').value.trim(),htmlContent=$('#html').value.trim();if(title.length<2||!htmlContent){$('#publishStatus').textContent='Escribe un título y código HTML.';return}const games=getGames();games.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title,htmlContent,author:activeUser.username||'Jugador',createdAt:new Date().toISOString()});try{setGames(games);trophy('published-game');$('#title').value='';$('#html').value='';$('#publishStatus').textContent='Juego guardado en esta consola.';setTab('store');render()}catch(e){$('#publishStatus').textContent='No se pudo guardar. Puede que el almacenamiento esté lleno.'}};$('#importBtn').onclick=()=>$('#importFile').click();$('#importFile').onchange=async()=>{const file=$('#importFile').files[0];if(!file)return;try{const p=JSON.parse(await file.text());if(!p||p.format!=='NEXUS_GAME'||p.schema!==1||typeof p.title!=='string'||typeof p.htmlContent!=='string'||p.htmlContent.length>2_000_000)throw new Error('Archivo .nexusgame no válido.');const games=getGames();games.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),title:p.title.slice(0,60),htmlContent:p.htmlContent,author:p.author||'Importado',createdAt:new Date().toISOString()});setGames(games);$('#status').textContent='Juego importado correctamente.';render()}catch(e){$('#status').textContent='No se pudo importar: '+e.message}finally{$('#importFile').value=''}};render();if(new URLSearchParams(location.search).get('embedded')==='1'){$('#back').textContent='← Cerrar';$('#back').onclick=()=>parent.postMessage({type:'NEXUS_EXIT_APP'},location.origin)}})();
</script></body></html>
