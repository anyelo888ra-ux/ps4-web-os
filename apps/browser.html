<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Navegador NEXUS</title><body style="margin:0;background:#101827;color:white;font:16px Arial;padding:30px"><h1>🌐 Navegador</h1><p>Escribe una dirección web para abrirla dentro de esta pantalla.</p><form id="f"><input id="url" placeholder="https://example.com" style="width:70%;padding:12px"><button style="padding:12px">Ir</button></form><iframe id="view" style="width:100%;height:65vh;border:1px solid #456;margin-top:20px"></iframe><script>f.onsubmit=e=>{e.preventDefault();let u=url.value.trim();if(!/^https?:\/\//i.test(u))u='https://'+u;view.src=u}</script></body></html>
