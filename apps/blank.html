<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020713"><title>NEXUS Blank</title><link rel="icon" type="image/svg+xml" href="../favicon.svg">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020713;color:#fff;font-family:Arial,sans-serif}body{display:flex;flex-direction:column;overflow:hidden}.bar{height:54px;flex:0 0 54px;display:flex;align-items:center;gap:9px;padding:8px 13px;background:#07162b;border-bottom:1px solid #ffffff1c}.brand{font-weight:900;letter-spacing:.1em;white-space:nowrap}.url{min-width:0;flex:1;background:#020b18;border:1px solid #ffffff25;border-radius:8px;padding:10px;color:white;outline:none}.btn{background:#176bc3;color:white;border:0;border-radius:7px;padding:10px 13px;cursor:pointer}.tools{display:flex;gap:8px;align-items:center;padding:9px 13px;background:#081327;border-bottom:1px solid #ffffff14;font-size:12px;color:#a9bdd8}.tools input[type=color]{width:28px;height:23px;border:0;background:transparent}.stage{position:relative;flex:1;min-height:0;background:#020713}.frame{width:100%;height:100%;border:0;background:#020713}.welcome{position:absolute;inset:0;display:grid;place-items:center;text-align:center;pointer-events:none}.welcome img{width:66px;height:66px;filter:drop-shadow(0 0 18px #248cff99)}.welcome h1{letter-spacing:.22em;font-size:clamp(20px,4vw,30px)}.welcome p{color:#7893b8;font-size:12px}.loader{position:absolute;inset:0;background:#020713;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:4;text-align:center;padding:20px}.loader.show{display:flex}.loader img{width:64px;height:64px;animation:pulse 1.6s infinite}.track{width:min(320px,75vw);height:5px;background:#1c2c45;border-radius:8px;margin:18px 0 9px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,#258aff,#bde4ff);transition:width .2s}.detail{font:11px monospace;color:#91aaca;min-height:17px}@keyframes pulse{50%{opacity:.65;transform:scale(.95)}}@media(max-width:520px){.brand{display:none}.bar{gap:6px}.btn{padding:10px}.tools{flex-wrap:wrap}}
</style></head><body>
<header class="bar"><span class="brand">◈ NEXUS BLANK</span><input id="address" class="url" value="about:blank" aria-label="Dirección web" placeholder="https://example.com"><button id="go" class="btn">Ir ↵</button><button id="home" class="btn" title="Volver a about:blank">⌂</button></header>
<div class="tools"><span>Pantalla:</span><input id="color" type="color" value="#020713" aria-label="Color de fondo"><label><input id="showTitle" type="checkbox" checked> Mostrar bienvenida</label><span style="margin-left:auto">ESC: volver al menú</span></div>
<main class="stage" id="stage"><iframe id="view" class="frame" title="NEXUS Blank" src="about:blank" referrerpolicy="strict-origin-when-cross-origin"></iframe><div id="welcome" class="welcome"><div><img src="../favicon.svg" alt="NEXUS"><h1>ABOUT:BLANK</h1><p>Tu página en blanco, ahora con estilo NEXUS.</p></div></div><div id="loader" class="loader"><img src="../favicon.svg" alt=""><h2 style="letter-spacing:.18em">PS4 LOADING</h2><p style="color:#91a9c8;font-size:12px">Cargando página...</p><div class="track"><div id="fill" class="fill"></div></div><div><span id="pct">0</span>%</div><div id="detail" class="detail">Apagando pantalla...</div></div></main>
<script src="../assets/js/audio.js"></script><script>
(()=>{const $=s=>document.querySelector(s),frame=$('#view'),loader=$('#loader');let timer=null;function blank(){clearInterval(timer);frame.src='about:blank';$('#address').value='about:blank';$('#welcome').style.display=$('#showTitle').checked?'grid':'none';loader.classList.remove('show');$('#stage').style.background=$('#color').value;frame.style.background=$('#color').value;audio.playBack()}
function navigate(){let raw=$('#address').value.trim();if(!raw||raw==='about:blank'){blank();return}if(!/^https?:\/\//i.test(raw))raw='https://'+raw;let url;try{url=new URL(raw)}catch{$('#detail').textContent='Dirección no válida';loader.classList.add('show');return}if(!['http:','https:'].includes(url.protocol))return;$('#welcome').style.display='none';loader.classList.add('show');$('#fill').style.width='3%';$('#pct').textContent='3';$('#detail').textContent='Oscureciendo pantalla...';let p=3;clearInterval(timer);timer=setInterval(()=>{p=Math.min(92,p+Math.max(1,(94-p)*.075));$('#fill').style.width=p+'%';$('#pct').textContent=Math.round(p);$('#detail').textContent=p<30?'Preparando navegador...':p<60?'Solicitando '+url.hostname+'...':'Esperando respuesta del servidor...'},160);frame.src=url.href;audio.playSelect()}
frame.addEventListener('load',()=>{if(!loader.classList.contains('show'))return;clearInterval(timer);$('#fill').style.width='100%';$('#pct').textContent='100';$('#detail').textContent='Carga completada · Si no aparece, el sitio puede bloquear iframes';setTimeout(()=>loader.classList.remove('show'),650)});
$('#go').onclick=navigate;$('#address').addEventListener('keydown',e=>{if(e.key==='Enter')navigate()});$('#home').onclick=blank;$('#color').oninput=()=>{if($('#address').value==='about:blank'){$('#stage').style.background=$('#color').value;frame.style.background=$('#color').value}};$('#showTitle').onchange=()=>{if($('#address').value==='about:blank')$('#welcome').style.display=$('#showTitle').checked?'grid':'none'};document.addEventListener('keydown',e=>{if(e.key==='Escape'){parent.postMessage({type:'NEXUS_EXIT_APP'},'*')}});})();
</script></body></html>
