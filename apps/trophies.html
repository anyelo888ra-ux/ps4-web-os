<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07152e"><title>Trofeos — NEXUS.OS</title><link rel="icon" href="../favicon.svg"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 20% 0,#174477,#061326 60%,#020713);color:#fff;font:15px Arial;padding:clamp(18px,4vw,42px)}main{max-width:1000px;margin:auto}.muted{color:#9db5d2}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.btn{border:1px solid #ffffff28;background:#ffffff12;color:white;border-radius:8px;padding:10px 14px;cursor:pointer}.stats{display:flex;gap:12px;flex-wrap:wrap;margin:22px 0}.stat{padding:16px 20px;border:1px solid #ffffff20;border-radius:12px;background:#ffffff0a;min-width:145px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:13px}.trophy{border:1px solid #ffffff20;border-radius:13px;padding:18px;background:#ffffff09;min-height:150px}.trophy.locked{opacity:.55;filter:grayscale(.8)}.icon{font-size:32px}.trophy h3{margin:10px 0 6px}.pill{font-size:10px;letter-spacing:.1em;color:#8fc7ff}
</style></head><body><main><div class="top"><div><p class="muted">NEXUS SYSTEM SOFTWARE</p><h1>🏆 Centro de trofeos</h1><p class="muted" id="who">Perfil local</p></div><button class="btn" onclick="location.href='../menu.html'">← Volver al menú</button></div><div class="stats"><div class="stat"><div class="muted">Desbloqueados</div><strong id="count">0 / 8</strong></div><div class="stat"><div class="muted">Progreso</div><strong id="percent">0%</strong></div></div><div class="grid" id="grid"></div></main><script>
(()=>{'use strict';const KEY='nexus_os_trophies_v1';const catalog=[
['first-boot','🚀','Primer arranque','Inicia NEXUS.OS por primera vez.','Bronce'],
['first-game','🎮','¡A jugar!','Abre tu primer juego desde el menú.','Bronce'],
['published-game','🧩','Desarrollador','Publica un juego en NEXUS Store.','Plata'],
['share-game','📦','Compartiendo diversión','Exporta un juego para compartirlo.','Bronce'],
['first-backup','💾','Punto de restauración','Crea tu primer respaldo JSON.','Bronce'],
['first-share','📡','Conectado','Abre el centro de compartir pantalla.','Bronce'],
['collector-3','⭐','Coleccionista','Desbloquea tres trofeos.','Plata'],
['nexus-veteran','👑','NEXUS Veteran','Desbloquea todos los demás trofeos.','Oro']
];let user={};try{user=JSON.parse(localStorage.getItem('nexus_active_user')||'{}')}catch{}const uid=String(user.id||'guest');document.querySelector('#who').textContent=(user.avatar||'🎮')+' '+(user.username||'Invitado');function read(){try{return JSON.parse(localStorage.getItem(KEY)||'{}')}catch{return {}}}function save(data){localStorage.setItem(KEY,JSON.stringify(data))}function unlock(id){const data=read();data[uid]=data[uid]||{};if(!data[uid][id]){data[uid][id]={at:new Date().toISOString()};save(data)}render()}function render(){const data=read()[uid]||{};let done=0;const grid=document.querySelector('#grid');grid.replaceChildren();catalog.forEach(([id,icon,name,desc,rank])=>{const ok=!!data[id];if(ok)done++;const card=document.createElement('article');card.className='trophy'+(ok?'':' locked');const em=document.createElement('div');em.className='icon';em.textContent=icon;const h=document.createElement('h3');h.textContent=name;const p=document.createElement('p');p.className='muted';p.textContent=desc;const tag=document.createElement('span');tag.className='pill';tag.textContent=ok?'DESBLOQUEADO · '+rank.toUpperCase():'BLOQUEADO · '+rank.toUpperCase();card.append(em,h,p,tag);grid.append(card)});if(done>=3&&!data['collector-3']){data['collector-3']={at:new Date().toISOString()};save(read());return render()}if(done>=7&&!data['nexus-veteran']){data['nexus-veteran']={at:new Date().toISOString()};save(read());return render()}document.querySelector('#count').textContent=done+' / '+catalog.length;document.querySelector('#percent').textContent=Math.round(done/catalog.length*100)+'%'}window.addEventListener('storage',render);window.addEventListener('message',e=>{if(e.origin!==location.origin||!e.data||e.data.type!=='NEXUS_TROPHY_UNLOCK')return;if(catalog.some(x=>x[0]===e.data.trophyId))unlock(e.data.trophyId)});unlock('first-boot')})();
</script></body></html>
