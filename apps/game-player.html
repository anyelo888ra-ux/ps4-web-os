<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Juego — NEXUS.OS</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020713;color:white;font:14px Arial}header{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#07162d}button{background:#c83245;color:#fff;border:0;border-radius:6px;padding:7px 12px;cursor:pointer}iframe{display:block;width:100%;height:calc(100% - 42px);border:0;background:#000}</style></head><body><header><b id="title">NEXUS Game Player</b><button onclick="window.close()">✕ Cerrar</button></header><iframe id="game" sandbox="allow-scripts allow-forms allow-pointer-lock allow-downloads" allow="fullscreen; gamepad" title="Juego HTML aislado"></iframe><script>(()=>{try{const raw=sessionStorage.getItem('nexus_game_to_run');if(!raw)throw new Error('No se encontró el juego. Vuelve a NEXUS Store.');const g=JSON.parse(raw);if(!g||typeof g.htmlContent!=='string')throw new Error('Paquete inválido.');document.querySelector('#title').textContent=g.title||'Juego';document.querySelector('#game').srcdoc=g.htmlContent;sessionStorage.removeItem('nexus_game_to_run')}catch(e){document.querySelector('#title').textContent='Error';document.querySelector('#game').srcdoc='<h2 style="font:16px Arial;color:white;background:#111;padding:20px">'+String(e.message).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))+'</h2>'}})();</script></body></html>
