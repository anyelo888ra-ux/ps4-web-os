<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07152e"><title>Crear perfil — NEXUS.OS</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="assets/css/style.css">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#06132b;color:white;font-family:Arial,sans-serif;display:grid;place-items:center;padding:20px}.waves-bg{position:fixed!important;inset:0;z-index:0;pointer-events:none}.card{position:relative;z-index:1;width:min(470px,100%);padding:clamp(22px,5vw,36px);border:1px solid #ffffff25;border-radius:18px;background:#07172de8;box-shadow:0 25px 90px #0008;backdrop-filter:blur(14px)}.brand{text-align:center;font-size:24px;font-weight:900;letter-spacing:.18em}.muted{color:#a8bdd8}.field{width:100%;margin-top:8px;padding:13px 14px;background:#020b19;border:1px solid #ffffff30;border-radius:9px;color:white;outline:none}.field:focus{border-color:#65b5ff}.avatars{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0 22px}.avatar-opt{width:57px;height:57px;border:2px solid #ffffff25;border-radius:12px;background:#ffffff0d;font-size:27px;cursor:pointer}.avatar-opt.active{border-color:#fff;background:#287ad0}.primary{width:100%;padding:13px;background:#176bd1;color:white;border:0;border-radius:9px;font-weight:bold;cursor:pointer}.primary:hover{background:#2789f5}.secondary{background:transparent;border:0;color:#9ecbff;cursor:pointer;padding:12px}
</style></head><body><div class="waves-bg"></div><main class="card"><div class="brand">◈ NEXUS.OS</div><h1 style="text-align:center;margin:25px 0 5px;font-size:25px">Crear jugador</h1><p class="muted" style="text-align:center;font-size:13px;margin:0 0 25px">Personaliza tu perfil de consola</p><label for="username" class="muted" style="font-size:12px;font-weight:bold">NOMBRE DE USUARIO</label><input id="username" class="field" maxlength="20" autocomplete="nickname" placeholder="Ej. c00lkidd_player"><p id="error" role="alert" style="color:#ff9b9b;font-size:12px;min-height:16px"></p><div class="muted" style="font-size:12px;font-weight:bold;text-align:center">ELIGE TU AVATAR</div><div class="avatars" id="avatars"><button type="button" class="avatar-opt active" data-avatar="🤖">🤖</button><button type="button" class="avatar-opt" data-avatar="🎮">🎮</button><button type="button" class="avatar-opt" data-avatar="👾">👾</button><button type="button" class="avatar-opt" data-avatar="🔥">🔥</button><button type="button" class="avatar-opt" data-avatar="🐱">🐱</button><button type="button" class="avatar-opt" data-avatar="🚀">🚀</button></div><button id="create" class="primary">Guardar y entrar</button><button id="back" class="secondary" style="width:100%">Volver a seleccionar usuario</button><p class="muted" style="font-size:11px;text-align:center;margin:18px 0 0">Los perfiles se guardan en este navegador.</p></main>
<script src="assets/js/audio.js"></script><script>
(()=>{let avatar='🤖';const input=document.querySelector('#username'),error=document.querySelector('#error');document.querySelectorAll('.avatar-opt').forEach(b=>b.onclick=()=>{document.querySelectorAll('.avatar-opt').forEach(x=>x.classList.remove('active'));b.classList.add('active');avatar=b.dataset.avatar;audio.playMove()});function create(){const username=input.value.trim().replace(/\s+/g,' ');if(username.length<2||username.length>20){error.textContent='Usa entre 2 y 20 caracteres.';return}if(/[<>]/.test(username)){error.textContent='Ese nombre contiene caracteres no permitidos.';return}let users=[];try{users=JSON.parse(localStorage.getItem('nexus_os_users')||'[]');if(!Array.isArray(users))users=[]}catch{}if(users.some(u=>String(u.username||'').toLowerCase()===username.toLowerCase())){error.textContent='Ya existe un perfil con ese nombre.';return}const user={id:Date.now(),username,avatar,createdAt:new Date().toISOString()};users.push(user);localStorage.setItem('nexus_os_users',JSON.stringify(users));localStorage.setItem('nexus_active_user',JSON.stringify(user));audio.playSelect();location.href='menu.html'}document.querySelector('#create').onclick=create;input.addEventListener('keydown',e=>{if(e.key==='Enter')create()});document.querySelector('#back').onclick=()=>location.href='login.html';input.focus()})();
</script></body></html>
