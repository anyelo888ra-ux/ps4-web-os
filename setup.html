<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración Inicial - NEXUS.OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-slate-950 text-white h-screen overflow-hidden flex flex-col justify-between p-12 select-none">
    <div class="waves-bg fixed inset-0 z-0 pointer-events-none opacity-80"></div>

    <div class="relative z-10 flex items-center gap-4">
        <div class="text-3xl font-extrabold tracking-widest text-blue-100 flex items-center gap-2">
            <span>⚡</span> NEXUS.OS
        </div>
    </div>

    <div class="relative z-10 max-w-md mx-auto w-full flex flex-col gap-6">
        <div class="text-center">
            <h2 class="text-2xl font-bold text-white mb-1">Configuración Inicial</h2>
            <p class="text-slate-300 text-xs">Crea tu usuario para comenzar a usar la consola web.</p>
        </div>

        <div class="space-y-4 bg-white/5 p-6 rounded-2xl border border-white/10 shadow-2xl backdrop-blur-md">
            <div>
                <label class="block text-xs font-bold text-slate-300 mb-2">Nombre de Usuario</label>
                <input type="text" id="setup-username" placeholder="Ej: c00lkidd_player" class="w-full bg-slate-900/80 border border-white/20 rounded-lg px-4 py-2.5 text-sm text-white focus:outline-none focus:border-blue-400 transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-300 mb-2">Selecciona un Avatar</label>
                <div class="flex gap-4 justify-center">
                    <button class="avatar-opt active w-14 h-14 rounded-lg bg-blue-600 border-2 border-white flex items-center justify-center text-2xl transition cursor-pointer" data-avatar="🤖">🤖</button>
                    <button class="avatar-opt w-14 h-14 rounded-lg bg-indigo-600 border-2 border-transparent flex items-center justify-center text-2xl transition cursor-pointer" data-avatar="🎮">🎮</button>
                    <button class="avatar-opt w-14 h-14 rounded-lg bg-purple-600 border-2 border-transparent flex items-center justify-center text-2xl transition cursor-pointer" data-avatar="👾">👾</button>
                    <button class="avatar-opt w-14 h-14 rounded-lg bg-emerald-600 border-2 border-transparent flex items-center justify-center text-2xl transition cursor-pointer" data-avatar="🔥">🔥</button>
                </div>
            </div>

            <button id="btn-create-user" class="w-full bg-blue-600 hover:bg-blue-500 font-bold text-sm py-3 rounded-lg transition shadow-lg shadow-blue-600/30 cursor-pointer mt-2">
                Guardar y Entrar
            </button>
        </div>
    </div>

    <div class="relative z-10 text-center text-xs text-slate-400 border-t border-white/10 pt-4">
        <span>Los datos de usuario se guardan localmente en tu navegador.</span>
    </div>

    <script>
        let selectedAvatar = '🤖';
        document.querySelectorAll('.avatar-opt').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.avatar-opt').forEach(b => b.classList.replace('border-white', 'border-transparent'));
                btn.classList.replace('border-transparent', 'border-white');
                selectedAvatar = btn.dataset.avatar;
            });
        });

        document.getElementById('btn-create-user').addEventListener('click', () => {
            const username = document.getElementById('setup-username').value.trim();
            if (!username) return alert('Por favor ingresa un nombre de usuario.');

            const users = JSON.parse(localStorage.getItem('nexus_os_users') || '[]');
            const newUser = { id: Date.now(), username, avatar: selectedAvatar };
            users.push(newUser);
            localStorage.setItem('nexus_os_users', JSON.stringify(users));
            localStorage.setItem('nexus_active_user', JSON.stringify(newUser));

            window.location.href = 'menu.html';
        });
    </script>
</body>
</html>
