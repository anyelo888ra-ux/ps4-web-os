<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FLAP DASH</title><style>body{margin:0;background:#15294b;color:white;font-family:Arial;text-align:center}canvas{background:linear-gradient(#69c8ec,#e5f8ff);display:block;margin:18px auto;width:min(92vw,520px);border-radius:12px}button{padding:10px 18px}</style><h1>🐤 FLAP DASH</h1><p>Espacio o toque para volar.</p><canvas id="c" width="520" height="520"></canvas><p>Puntos: <b id="s">0</b> <button onclick="reset()">Reiniciar</button></p><script>let c=document.getElementById('c'),g=c.getContext('2d'),y=250,v=0,obs=[],score=0,dead=false;function flap(){if(dead)reset();v=-6}onkeydown=e=>{if(e.code==='Space')flap()};c.onclick=flap;function reset(){y=250;v=0;obs=[];score=0;dead=false;document.getElementById('s').textContent=0}function loop(){g.clearRect(0,0,520,520);g.fillStyle='#65a85d';g.fillRect(0,480,520,40);if(!dead){v+=.28;y+=v;if(Math.random()<.018)obs.push({x:540,h:100+Math.random()*220,passed:false});obs.forEach(o=>{o.x-=3;g.fillStyle='#28734b';g.fillRect(o.x,0,55,o.h);g.fillRect(o.x,o.h+145,55,335-o.h);if(o.x<100&&!o.passed){score++;o.passed=true;document.getElementById('s').textContent=score}if(o.x<130&&o.x>55&&(y<o.h||y>o.h+145))dead=true});obs=obs.filter(o=>o.x>-60);if(y>465||y<0)dead=true}g.fillStyle='#ffca45';g.beginPath();g.arc(100,y,17,0,7);g.fill();if(dead){g.fillStyle='#132033cc';g.fillRect(0,0,520,520);g.fillStyle='white';g.font='bold 32px Arial';g.fillText('Fin de partida',140,250);g.font='16px Arial';g.fillText('Toca para reintentar',175,285)}requestAnimationFrame(loop)}loop();</script></html>
