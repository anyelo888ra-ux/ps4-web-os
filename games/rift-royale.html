<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rift Royale</title><style>body{margin:0;background:linear-gradient(#49308a,#151a39);color:white;font-family:Arial;text-align:center}canvas{display:block;margin:15px auto;background:linear-gradient(#8ad4e8,#4c9a70);width:min(94vw,850px);height:auto;border:3px solid #fff;border-radius:12px}button{padding:10px 18px;border:0;border-radius:8px;background:#a8f06a;font-weight:bold}</style><h1>🪂 RIFT ROYALE</h1><p>Sobrevive a la tormenta arcade. Muévete con WASD/flechas y evita los drones.</p><canvas id="c" width="850" height="520"></canvas><p>Tiempo: <b id="time">0</b>s · Récord: <b id="best">0</b>s <button onclick="reset()">Reiniciar</button></p><script>const c=document.getElementById('c'),g=c.getContext('2d');let p={x:425,y:260},en=[],keys={},t=0,alive=true,best=+(localStorage.riftBest||0);document.getElementById('best').textContent=best;onkeydown=e=>keys[e.key.toLowerCase()]=true;onkeyup=e=>keys[e.key.toLowerCase()]=false;function reset(){p={x:425,y:260};en=[];t=0;alive=true}function frame(){g.clearRect(0,0,850,520);g.fillStyle='#70b77d';g.fillRect(0,0,850,520);for(let i=0;i<35;i++){g.fillStyle='#428b59';g.fillRect((i*137)%850,(i*79)%520,22,28)}if(alive){if(keys.a||keys.arrowleft)p.x-=3;if(keys.d||keys.arrowright)p.x+=3;if(keys.w||keys.arrowup)p.y-=3;if(keys.s||keys.arrowdown)p.y+=3;p.x=Math.max(14,Math.min(836,p.x));p.y=Math.max(14,Math.min(506,p.y));if(Math.random()<.025)en.push({x:Math.random()*850,y:-15,v:2+Math.random()*2});en.forEach(e=>e.y+=e.v);en=en.filter(e=>e.y<540);if(en.some(e=>Math.hypot(e.x-p.x,e.y-p.y)<22)){alive=false;best=Math.max(best,t);localStorage.riftBest=best;document.getElementById('best').textContent=best}}g.fillStyle='#f8d44e';g.beginPath();g.arc(p.x,p.y,14,0,7);g.fill();g.fillStyle='#ff526b';en.forEach(e=>{g.beginPath();g.arc(e.x,e.y,12,0,7);g.fill()});if(alive){t++;document.getElementById('time').textContent=Math.floor(t/60)}else{g.fillStyle='#111c';g.fillRect(0,0,850,520);g.fillStyle='white';g.font='bold 42px Arial';g.fillText('FIN DE PARTIDA',270,250);g.font='20px Arial';g.fillText('Pulsa Reiniciar para volver',300,290)}requestAnimationFrame(frame)}frame();</script></html>
