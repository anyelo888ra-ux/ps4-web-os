<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BlockWorld</title><style>body{margin:0;background:#172c3a;color:white;font-family:Arial;text-align:center}#world{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;width:min(94vw,650px);margin:25px auto;background:#0c1720;padding:8px;border-radius:12px}.cell{aspect-ratio:1;border:0;border-radius:4px;background:#478b55;font-size:clamp(12px,3vw,25px);cursor:pointer}.cell:nth-child(3n){background:#8b673c}.cell:focus{outline:3px solid white}</style><h1>🧱 BLOCKWORLD</h1><p>Construye tu pequeño mundo: toca una casilla para cambiar el bloque.</p><div id="world"></div><p>Bloques colocados: <b id="count">0</b> · <button onclick="clearWorld()">Nuevo mundo</button></p><script>const w=document.getElementById('world');let count=0;for(let i=0;i<96;i++){let b=document.createElement('button');b.className='cell';b.textContent='🌱';b.onclick=()=>{b.textContent=b.textContent==='🌱'?'🧱':b.textContent==='🧱'?'🌳':b.textContent==='🌳'?'💎':'🌱';count++;document.getElementById('count').textContent=count};w.appendChild(b)}function clearWorld(){[...w.children].forEach(b=>b.textContent='🌱');count=0;document.getElementById('count').textContent=0}</script></html>
