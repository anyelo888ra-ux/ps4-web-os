<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Turbo Arena</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(#1b5672,#071522);color:white;font-family:Arial;overflow:hidden}header{padding:14px;text-align:center}canvas{display:block;width:min(94vw,900px);height:min(68vh,540px);margin:auto;background:linear-gradient(#5ca8d0 0 42%,#23824d 42%);border:3px solid #bdeaff;border-radius:12px}#hud{text-align:center;padding:10px}button{padding:10px 18px;border:0;border-radius:8px;background:#ffb52e;font-weight:bold}small{color:#d4e6f2}</style><header><h1>🚗 TURBO ARENA ⚽</h1><small>Mini juego original: conduce y mete el balón en la portería. Flechas o WASD.</small></header><canvas id="game" width="900" height="540"></canvas><div id="hud">Goles: <b id="score">0</b> · <button id="reset">Reiniciar</button></div><script>const c=document.getElementById('game'),x=c.getContext('2d');let car={x:450,y:420,a:0},ball={x:450,y:170,vx:2,vy:2},score=0,keys={};onkeydown=e=>keys[e.key.toLowerCase()]=true;onkeyup=e=>keys[e.key.toLowerCase()]=false;function draw(){x.clearRect(0,0,900,540);x.fillStyle='#25864f';x.fillRect(0,0,900,540);x.strokeStyle='#d8ffe0';x.lineWidth=4;x.strokeRect(35,35,830,470);x.beginPath();x.arc(450,270,90,0,7);x.stroke();x.fillStyle='#eaf5ff';x.fillRect(350,30,200,12);x.fillRect(350,498,200,12);x.save();x.translate(car.x,car.y);x.rotate(car.a);x.fillStyle='#ffb52e';x.fillRect(-30,-18,60,36);x.fillStyle='#142b40';x.fillRect(-12,-14,25,28);x.restore();x.beginPath();x.arc(ball.x,ball.y,17,0,7);x.fillStyle='white';x.fill();x.strokeStyle='#333';x.stroke();}function loop(){if(keys.arrowleft||keys.a)car.a-=.055;if(keys.arrowright||keys.d)car.a+=.055;if(keys.arrowup||keys.w){car.x+=Math.sin(car.a)*3.4;car.y-=Math.cos(car.a)*3.4}if(keys.arrowdown||keys.s){car.x-=Math.sin(car.a)*2;car.y+=Math.cos(car.a)*2}car.x=Math.max(55,Math.min(845,car.x));car.y=Math.max(65,Math.min(475,car.y));ball.x+=ball.vx;ball.y+=ball.vy;ball.vx*=.995;ball.vy*=.995;if(ball.x<55||ball.x>845)ball.vx*=-1;if(ball.y<45||ball.y>495){if(ball.x>350&&ball.x<550){score++;document.getElementById('score').textContent=score;ball={x:450,y:170,vx:2,vy:2}}else ball.vy*=-1}if(Math.hypot(ball.x-car.x,ball.y-car.y)<43){ball.vx+=(ball.x-car.x)*.09;ball.vy+=(ball.y-car.y)*.09}draw();requestAnimationFrame(loop)}document.getElementById('reset').onclick=()=>{score=0;document.getElementById('score').textContent=0;ball={x:450,y:170,vx:2,vy:2};car={x:450,y:420,a:0}};loop();</script></html>
