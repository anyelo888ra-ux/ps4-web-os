<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#07152e"><title>NEXUS.OS — PS4 Web OS</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="assets/css/style.css">
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#06132b;color:#fff;font-family:Arial,sans-serif;overflow:hidden}.waves-bg{position:fixed;inset:0;background:radial-gradient(ellipse at 55% 30%,#174d91 0%,#0a2348 38%,#020817 100%);z-index:-2}.waves-bg:after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,#4ca4ff13 50%,transparent 70%);animation:glide 12s linear infinite}@keyframes glide{to{transform:translateX(30%)}}.tile{width:clamp(118px,15vw,190px);height:clamp(118px,15vw,190px);flex:0 0 auto;border:2px solid #ffffff22;border-radius:5px;background:linear-gradient(145deg,var(--c1),var(--c2));display:flex;flex-direction:column;justify-content:space-between;padding:15px;opacity:.82;transition:.2s;cursor:pointer;text-align:left}.tile.active{opacity:1;transform:scale(1.12);border:3px solid white;box-shadow:0 12px 45px #0008}.tile .emoji{font-size:38px}.tile small{color:#dbeafe}.screen{position:fixed;inset:0;z-index:40;background:#030914;display:none}.screen.open{display:flex;flex-direction:column}.screen iframe{border:0;width:100%;height:100%;background:#050b18;flex:1}.boot-cover{position:absolute;z-index:5;inset:48px 0 0;background:#02050c;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px}.boot-cover.show{display:flex}.boot-logo{width:68px;height:68px;object-fit:contain;filter:drop-shadow(0 0 20px #328fff99);animation:bootpulse 1.8s infinite}.boot-title{font-size:20px;letter-spacing:.2em;font-weight:900;margin:15px 0 7px}.boot-track{width:min(330px,75vw);height:5px;background:#1c2b42;border-radius:9px;overflow:hidden;margin:20px 0 10px}.boot-fill{height:100%;width:0;background:linear-gradient(90deg,#268bff,#b3ddff);box-shadow:0 0 14px #268bff;transition:width .2s}.boot-detail{font:11px monospace;color:#8ca8c9;min-height:17px}@keyframes bootpulse{50%{transform:scale(.94);opacity:.75}}.screenbar{height:48px;flex:0 0 48px;background:#07162d;border-bottom:1px solid #ffffff20;display:flex;align-items:center;justify-content:space-between;padding:0 14px}.screenbar button{background:#c83245;padding:7px 14px;border-radius:5px;font-weight:bold}.xmb-wrap{overflow-x:auto;scrollbar-width:none;padding:35px 24px}.xmb-wrap::-webkit-scrollbar{display:none}#carousel{display:flex;align-items:center;gap:22px;width:max-content;min-height:220px}.topbar,.bottombar{padding:18px 4vw;display:flex;align-items:center;justify-content:space-between}.bottombar{border-top:1px solid #ffffff25;color:#b9c9df;font-size:12px}.hint{background:#ffffff24;border-radius:4px;padding:3px 8px;color:white}#subnav{display:flex;gap:18px;color:#c7d8ef;font-size:13px;padding:0 4vw}#subnav span{cursor:pointer}.mobile-controls{display:none}@media(max-width:650px){.topbar{padding:12px 16px}.xmb-wrap{padding:24px 16px}#carousel{gap:16px}.bottombar{padding:12px 16px}.desktop-hint{display:none}.mobile-controls{display:flex;gap:8px}.tile{width:128px;height:128px}.tile .emoji{font-size:30px}} 
</style></head>
<body><div class="waves-bg"></div>
<main id="dashboard" class="h-screen flex flex-col justify-between">
<header class="topbar"><div class="flex gap-5 items-center"><b class="text-xl tracking-widest">◈ NEXUS.OS</b><span>⚡ <small>NEXUS Pass</small></span><span>🏆 <small>Trofeos</small></span></div><div class="flex gap-4 items-center"><span id="userLabel">Jugador</span><span id="clock" class="font-bold"></span></div></header>
<nav id="subnav"><span data-nav="games">Juegos</span><span data-nav="media">Multimedia</span><span data-nav="store">PlayStation Store</span><span data-nav="settings">Ajustes</span></nav>
<section class="my-auto"><div class="px-4 md:px-10 mb-3 text-sm text-blue-100" id="sectionTitle">Juegos y aplicaciones</div><div class="xmb-wrap"><div id="carousel">
<button class="tile active" data-id="pass" style="--c1:#d18a16;--c2:#70400c"><span class="emoji">⚡</span><span><b>NEXUS Pass</b><br><small>Centro de beneficios</small></span></button>
<button class="tile" data-id="store" style="--c1:#167bd2;--c2:#07386d"><span class="emoji">🛍️</span><span><b>NEXUS Store</b><br><small>Explorar y publicar</small></span></button>
<button class="tile" data-id="turbo-arena" style="--c1:#126d7d;--c2:#102a58"><span class="emoji">🚗⚽</span><span><b>Turbo Arena</b><br><small>Fútbol con vehículos</small></span></button>
<button class="tile" data-id="rift-royale" style="--c1:#7a36b4;--c2:#25205e"><span class="emoji">🪂</span><span><b>Rift Royale</b><br><small>Supervivencia arcade</small></span></button>
<button class="tile" data-id="blockworld" style="--c1:#269b68;--c2:#16452f"><span class="emoji">🧱</span><span><b>BlockWorld</b><br><small>Crear y explorar</small></span></button>
<button class="tile" data-id="flap" style="--c1:#42536b;--c2:#18243a"><span class="emoji">🐤</span><span><b>FLAP DASH</b><br><small>Arcade</small></span></button>
<button class="tile" data-id="nexus-ai" style="--c1:#4936b8;--c2:#17134e"><span class="emoji">🤖</span><span><b>NEXUS.AI</b><br><small>Asistente web</small></span></button>
<button class="tile" data-id="blank" style="--c1:#27364b;--c2:#080e1b"><span class="emoji">⬛</span><span><b>NEXUS Blank</b><br><small>Pantalla personalizada</small></span></button>
<button class="tile" data-id="browser" style="--c1:#168baf;--c2:#10456a"><span class="emoji">🌐</span><span><b>Navegador</b><br><small>Web</small></span></button>
<button class="tile" data-id="settings" style="--c1:#526176;--c2:#202b3a"><span class="emoji">⚙️</span><span><b>Ajustes</b><br><small>Sistema</small></span></button>
</div></div></section>
<footer class="bottombar"><div class="flex gap-5 desktop-hint"><span><kbd class="hint">← →</kbd> Mover</span><span><kbd class="hint">Enter</kbd> Abrir</span><span><kbd class="hint">Esc</kbd> Salir de juego</span></div><div class="mobile-controls"><button id="leftBtn" class="hint">◀</button><button id="openBtn" class="hint">Abrir</button><button id="rightBtn" class="hint">▶</button></div><div class="flex gap-4"><button id="switchUser" class="text-blue-200">Cambiar usuario</button><span>NEXUS Web Engine</span></div></footer>
</main>
<section id="appScreen" class="screen" aria-hidden="true"><div class="screenbar"><strong id="appTitle">Aplicación</strong><div class="flex gap-3 items-center"><span class="text-xs text-slate-300 hidden sm:inline">ESC para volver al menú</span><button id="exitApp">✕ Salir</button></div></div><iframe id="appFrame" title="Aplicación NEXUS" allow="fullscreen; gamepad; autoplay; clipboard-read; clipboard-write" referrerpolicy="strict-origin-when-cross-origin"></iframe><div id="bootCover" class="boot-cover"><img class="boot-logo" src="favicon.svg" alt="NEXUS.OS"><div class="boot-title">PS4 LOADING</div><div style="color:#91a9c8;font-size:12px">Iniciando aplicación</div><div class="boot-track"><div id="bootFill" class="boot-fill"></div></div><div style="font:12px monospace;color:#d4e7ff"><span id="bootPercent">0</span>%</div><div id="bootDetail" class="boot-detail">Preparando entorno...</div><div style="font:10px monospace;color:#526b89;margin-top:22px">NEXUS SYSTEM SOFTWARE</div></div></section>
<script src="assets/js/audio.js"></script><script>
(()=>{
const $=s=>document.querySelector(s), tiles=[...document.querySelectorAll('.tile')], frame=$('#appFrame'), screen=$('#appScreen');let index=0,opened=false,bootTimer=null,bootProgress=0;
let user;try{user=JSON.parse(localStorage.getItem('nexus_active_user')||'null')}catch{}if(!user){location.href='login.html';return}
$('#userLabel').textContent=(user.avatar||'🎮')+' '+(user.username||'Jugador');
function clock(){ $('#clock').textContent=new Date().toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});}clock();setInterval(clock,1000);
function select(i){const next=Math.max(0,Math.min(tiles.length-1,i));if(next!==index)audio.playMove();index=next;tiles.forEach((t,n)=>t.classList.toggle('active',n===index));tiles[index].scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});}
function setBoot(p,label){bootProgress=Math.min(100,p);$('#bootFill').style.width=bootProgress+'%';$('#bootPercent').textContent=Math.round(bootProgress);$('#bootDetail').textContent=label;}
function launch(id,title,url){opened=true;audio.playSelect();$('#appTitle').textContent=title;screen.classList.add('open');screen.setAttribute('aria-hidden','false');$('#dashboard').setAttribute('aria-hidden','true');$('#bootCover').classList.add('show');setBoot(4,'Apagando pantalla...');clearInterval(bootTimer);let step=0;const labels=['Inicializando NEXUS Web Engine...','Cargando interfaz del sistema...','Preparando recursos gráficos...','Solicitando '+url,'Esperando respuesta de la aplicación...'];bootTimer=setInterval(()=>{step++;setBoot(Math.min(90,8+step*6),labels[Math.min(labels.length-1,Math.floor(step/3))]);},180);setTimeout(()=>{if(opened){frame.src=url;$('#bootDetail').textContent='Cargando '+url;}},360);}
function exit(){if(!opened)return;opened=false;clearInterval(bootTimer);audio.playBack();frame.src='about:blank';$('#bootCover').classList.remove('show');screen.classList.remove('open');screen.setAttribute('aria-hidden','true');$('#dashboard').setAttribute('aria-hidden','false');}
function openSelected(){const id=tiles[index].dataset.id;const map={
'pass':['NEXUS Pass','apps/pass.html'],'store':['NEXUS Store','store.html?embedded=1'],
'turbo-arena':['Turbo Arena','games/turbo-arena.html'],'rift-royale':['Rift Royale','games/rift-royale.html'],
'blockworld':['BlockWorld','games/blockworld.html'],'flap':['FLAP DASH','games/flap-dash.html'],
'nexus-ai':['NEXUS.AI','https://nexus.ai-nex.duckdns.org/'],'browser':['Navegador','apps/browser.html'],'blank':['NEXUS Blank','apps/blank.html'],'settings':['Ajustes','apps/settings.html']};
const item=map[id];if(item)launch(id,item[0],item[1]);}
tiles.forEach((t,i)=>{t.addEventListener('click',()=>{select(i);openSelected()});});
document.addEventListener('keydown',e=>{if(opened){if(e.key==='Escape'){e.preventDefault();exit()}return}if(e.key==='ArrowRight'){e.preventDefault();select(index+1)}if(e.key==='ArrowLeft'){e.preventDefault();select(index-1)}if(e.key==='Enter'){e.preventDefault();openSelected()}});
frame.addEventListener('load',()=>{if(opened){try{frame.contentWindow.addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();exit()}})}catch{}clearInterval(bootTimer);setBoot(100,'Aplicación lista');setTimeout(()=>$('#bootCover').classList.remove('show'),220);}});window.addEventListener('message',e=>{if(e.data&&e.data.type==='NEXUS_EXIT_APP')exit()});$('#exitApp').addEventListener('click',exit);$('#leftBtn').onclick=()=>select(index-1);$('#rightBtn').onclick=()=>select(index+1);$('#openBtn').onclick=openSelected;
$('#switchUser').onclick=()=>{localStorage.removeItem('nexus_active_user');location.href='login.html'};
document.querySelectorAll('[data-nav]').forEach(n=>n.addEventListener('click',()=>{const target=n.dataset.nav;if(target==='store'){select(1);openSelected()}else if(target==='settings'){select(tiles.findIndex(t=>t.dataset.id==='settings'));openSelected()}else{select(target==='media'?tiles.findIndex(t=>t.dataset.id==='browser'):2)}}));
let gpIndex=-1;function pollGamepad(){const pads=navigator.getGamepads?.()||[];const gp=[...pads].find(Boolean);if(gp){if(gp.buttons[15]?.pressed&&gpIndex!==15){select(index+1);gpIndex=15}else if(gp.buttons[14]?.pressed&&gpIndex!==14){select(index-1);gpIndex=14}else if(gp.buttons[0]?.pressed&&gpIndex!==0){if(opened){}else openSelected();gpIndex=0}else if(!gp.buttons.some(b=>b.pressed))gpIndex=-1;}requestAnimationFrame(pollGamepad)}pollGamepad();select(0);
})();
</script></body></html>
