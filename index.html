<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#020713"><title>NEXUS.OS — Iniciando</title><link rel="icon" type="image/svg+xml" href="favicon.svg">
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#020713;color:#fff;font-family:Arial,sans-serif}body{display:grid;place-items:center;overflow:hidden}.boot{width:min(520px,88vw);text-align:center;animation:appear .8s ease both}.logo{width:94px;height:94px;object-fit:contain;filter:drop-shadow(0 0 25px #268cff88);animation:float 2.5s ease-in-out infinite}.brand{font-size:clamp(25px,6vw,38px);font-weight:900;letter-spacing:.24em;margin:18px 0 8px}.sub{color:#9db6d7;font-size:12px;letter-spacing:.2em;text-transform:uppercase}.track{height:5px;background:#1c2d48;border-radius:9px;overflow:hidden;margin:35px 0 13px}.bar{height:100%;width:0;background:linear-gradient(90deg,#258cff,#a5d9ff);box-shadow:0 0 18px #258cff;transition:width .25s}.meta{display:flex;justify-content:space-between;color:#a9bdd8;font:12px monospace}.files{margin:22px auto 0;text-align:left;max-width:360px;color:#7892b4;font:11px monospace;min-height:74px}.files div{padding:3px 0}.files div:before{content:'› ';color:#4fa6ff}.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:#58adff;margin-right:8px;animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.2}}@keyframes float{50%{transform:translateY(-7px)}}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
</style></head><body><main class="boot"><img class="logo" src="favicon.svg" alt="NEXUS.OS"><div class="brand">NEXUS.OS</div><div class="sub">Play beyond limits · System startup</div><div class="track"><div class="bar" id="bar"></div></div><div class="meta"><span id="status"><i class="pulse"></i>Preparando sistema</span><b id="percent">0%</b></div><div class="files" id="files"><div>Bootloader iniciado</div></div></main>
<script>
(async()=>{const assets=['favicon.svg','assets/css/style.css','assets/js/audio.js','login.html','setup.html','menu.html'];const bar=document.querySelector('#bar'),pct=document.querySelector('#percent'),status=document.querySelector('#status'),list=document.querySelector('#files');let done=0;const started=performance.now();function update(){const p=Math.round(done/assets.length*100);bar.style.width=p+'%';pct.textContent=p+'%'}for(const asset of assets){const line=document.createElement('div');line.textContent='Cargando '+asset;list.appendChild(line);try{const t=performance.now();const r=await fetch(asset,{method:'HEAD',cache:'no-store'});line.textContent=(r.ok?'✓ ':'! ')+asset+' · '+Math.max(1,Math.round(performance.now()-t))+' ms';line.style.color=r.ok?'#9bc9ff':'#e9bd78'}catch{line.textContent='· '+asset+' · caché/local';}done++;update();await new Promise(r=>setTimeout(r,95));}status.textContent='Sistema preparado';bar.style.width='100%';pct.textContent='100%';await new Promise(r=>setTimeout(r,Math.max(350,1250-(performance.now()-started))));let users=[];try{users=JSON.parse(localStorage.getItem('nexus_os_users')||'[]')}catch{}location.replace(users.length?'login.html':'setup.html')})();
</script></body></html>
