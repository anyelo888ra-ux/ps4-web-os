<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#07152e"><title>PS4TCHA — NEXUS Security</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="assets/css/ps4tcha.css"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 20%,#123a70,#030914 70%);color:white;font-family:Arial,sans-serif}.demo{width:min(600px,90vw);text-align:center}.demo img{width:75px}.demo h1{letter-spacing:.16em}.demo button{padding:12px 18px;border:0;border-radius:8px;background:#247ce0;color:white;font-weight:bold;cursor:pointer}.muted{color:#a8bad3;line-height:1.6}</style></head><body><main class="demo"><img src="favicon.svg" alt="NEXUS"><h1>PS4TCHA 1.0</h1><p class="muted">Sistema experimental de verificación humana para NEXUS.OS · versión 1.0. Demo local, no es una barrera de seguridad real.</p><button id="test">Probar desafío</button><p class="muted" id="result">El desafío se activa automáticamente si el navegador presenta señales de automatización.</p></main><script src="assets/js/ps4tcha.js"></script><script>document.querySelector('#test').onclick=()=>{PS4TCHA.clear();PS4TCHA.guard({force:true}).then(ok=>document.querySelector('#result').textContent=ok?'Verificación superada o no requerida.':'Verificación pendiente.');};</script></body></html>
